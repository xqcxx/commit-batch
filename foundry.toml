[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [
    { access = "read-write", path = "./deployments" },
    { access = "read-write", path = "./frontend/public/deployments" }
]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
